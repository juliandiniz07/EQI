<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos Corporativos · Assistente</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #5d6673;
    --accent: #0b5cad; --user: #e8f0fb; --border: #dde1e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --panel: #1b1e23; --text: #e6e8eb; --muted: #9aa3ad;
            --accent: #5ea3ec; --user: #1f2b3a; --border: #2c3138; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
         max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 100%; overflow-x: auto;
         background: var(--panel); border: 1px solid var(--border); }
  .msg.user { background: var(--user); align-self: flex-end; white-space: pre-wrap; }
  .msg.erro { border-color: #c0392b; }
  .msg table { border-collapse: collapse; margin: 8px 0; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .msg p:first-child { margin-top: 0; } .msg p:last-child { margin-bottom: 0; }
  .pensando { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
         background: var(--panel); max-width: 860px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; font: inherit; padding: 8px 10px; border-radius: 8px;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
           font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Assistente de Eventos Corporativos</h1>
  <p>Dividendos, JCP, rendimentos, desdobramentos, grupamentos, bonificações e subscrições.</p>
</header>
<div id="log">
  <div class="msg">Olá! Pergunte, por exemplo: <em>"Quais os próximos proventos de PETR4?"</em> ou
  <em>"Cliente tem 1.500 ITUB4, quanto recebe de JCP e como fica a posição após a bonificação?"</em></div>
</div>
<form id="form">
  <textarea id="entrada" rows="2" placeholder="Digite sua pergunta… (Enter envia, Shift+Enter quebra linha)" required></textarea>
  <button id="enviar">Enviar</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const entrada = document.getElementById("entrada");
  const enviar = document.getElementById("enviar");
  let sessaoId = null;

  function adicionar(classe, conteudo, markdown) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    if (markdown && window.marked && window.DOMPurify) {
      div.innerHTML = DOMPurify.sanitize(marked.parse(conteudo));
    } else {
      div.textContent = conteudo;
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  entrada.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const mensagem = entrada.value.trim();
    if (!mensagem) return;
    adicionar("user", mensagem, false);
    entrada.value = "";
    enviar.disabled = true;
    const aguardando = adicionar("pensando", "Consultando eventos…", false);
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem, sessao_id: sessaoId }),
      });
      const dados = await r.json();
      aguardando.remove();
      if (!r.ok) { adicionar("erro", dados.detail || "Erro ao consultar o assistente.", false); return; }
      sessaoId = dados.sessao_id;
      adicionar("bot", dados.resposta, true);
    } catch (err) {
      aguardando.remove();
      adicionar("erro", "Falha de conexão com o servidor.", false);
    } finally {
      enviar.disabled = false;
      entrada.focus();
    }
  });
</script>
</body>
</html>
