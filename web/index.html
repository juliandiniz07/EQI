<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0f1e">
<title>Assistente EQI · Eventos Corporativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --bg-2: #0f1629;
    --panel: #131b31;
    --panel-2: #18223c;
    --border: #232f4d;
    --text: #e8edf7;
    --muted: #8c98b3;
    --green: #00c896;
    --green-dim: rgba(0, 200, 150, .14);
    --danger: #ff6b6b;
    --radius: 14px;
    --c-opa: #a78bfa;
    --c-fusao: #60a5fa;
    --c-recuperacao: #f87171;
    --c-cancelamento: #9ca3af;
    --c-emissao: #34d399;
    --c-desdobramento: #fb923c;
    --c-liquidacao: #fbbf24;
    --c-fii: #2dd4bf;
    --c-evento: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.55;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ---------- logo ---------- */
  .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .5px; }
  .logo-mark {
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px;
    background: var(--green); color: #04261c; font-size: 15px; font-weight: 800; letter-spacing: .3px;
  }
  .logo-text { font-size: 18px; }
  .logo-text span { color: var(--green); }

  /* ---------- login ---------- */
  #login {
    min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(1000px 500px at 50% -10%, rgba(0,200,150,.12), transparent 70%), var(--bg);
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 20px; padding: 36px 28px 28px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .login-card .logo-mark { width: 64px; height: 64px; border-radius: 18px; font-size: 24px; margin: 0 auto 16px; }
  .login-card h1 { font-size: 20px; font-weight: 600; }
  .login-card p.sub { color: var(--muted); font-size: 14px; margin: 4px 0 24px; }
  .campo { text-align: left; margin-bottom: 14px; }
  .campo label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .campo input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg-2); outline: none; transition: border-color .15s;
  }
  .campo input:focus { border-color: var(--green); }
  .btn-primario {
    width: 100%; padding: 12px; border: 0; border-radius: 10px; margin-top: 6px;
    background: var(--green); color: #04261c; font-weight: 600; cursor: pointer; transition: filter .15s;
  }
  .btn-primario:hover { filter: brightness(1.08); }
  .btn-primario:disabled { opacity: .6; cursor: default; }
  .erro-login { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 12px; }

  /* ---------- chat ---------- */
  #chat { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: rgba(10,15,30,.92);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 2;
  }
  header .titulo { display: flex; align-items: center; gap: 12px; min-width: 0; }
  header .titulo .logo-mark { width: 36px; height: 36px; font-size: 13px; }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  header small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .btn-sair {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 7px 12px; border-radius: 9px; cursor: pointer; font-size: 13px;
  }
  .btn-sair:hover { color: var(--text); border-color: var(--muted); }

  #mensagens { flex: 1; overflow-y: auto; padding: 24px 16px 8px; scroll-behavior: smooth; }
  .trilho { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 12px; align-items: flex-start; animation: entrar .2s ease-out; }
  .msg.usuario { flex-direction: row-reverse; }
  @keyframes entrar { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
  }
  .msg.assistente .avatar { background: var(--green); color: #04261c; }
  .msg.usuario .avatar { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-size: 14px; }
  .corpo { min-width: 0; max-width: calc(100% - 46px); display: flex; flex-direction: column; gap: 10px; }
  .msg.usuario .corpo { align-items: flex-end; }
  .bolha {
    padding: 12px 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
  .msg.assistente .bolha { border-top-left-radius: 4px; }
  .msg.usuario .bolha { background: var(--green-dim); border-color: rgba(0,200,150,.3); border-top-right-radius: 4px; white-space: pre-wrap; }
  .bolha p + p { margin-top: 8px; }
  .bolha strong { color: #fff; font-weight: 600; }
  .bolha.erro { border-color: rgba(255,107,107,.45); color: #ffc9c9; }

  .sugestoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .sugestao {
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text);
    padding: 8px 12px; border-radius: 999px; cursor: pointer; font-size: 13.5px; transition: all .15s; text-align: left;
  }
  .sugestao:hover { border-color: var(--green); color: var(--green); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    --c: var(--c-evento);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
    padding: 3px 8px; border-radius: 6px; color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  }
  .badge[data-tipo="OPA"] { --c: var(--c-opa); }
  .badge[data-tipo="FUSAO"] { --c: var(--c-fusao); }
  .badge[data-tipo="RECUPERACAO"] { --c: var(--c-recuperacao); }
  .badge[data-tipo="CANCELAMENTO"] { --c: var(--c-cancelamento); }
  .badge[data-tipo="EMISSAO"] { --c: var(--c-emissao); }
  .badge[data-tipo="DESDOBRAMENTO"] { --c: var(--c-desdobramento); }
  .badge[data-tipo="LIQUIDACAO"] { --c: var(--c-liquidacao); }
  .badge[data-tipo="FII"] { --c: var(--c-fii); }
  .card .empresa { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .card .assunto { color: #c5cde0; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .rodape { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px; }
  .card .data { color: var(--muted); font-size: 12.5px; }
  .btn-pdf {
    font-size: 12.5px; font-weight: 600; color: var(--green); text-decoration: none;
    border: 1px solid rgba(0,200,150,.4); padding: 5px 10px; border-radius: 8px; white-space: nowrap;
  }
  .btn-pdf:hover { background: var(--green-dim); }
  .mais-eventos { color: var(--muted); font-size: 12.5px; }

  .digitando { display: inline-flex; gap: 5px; padding: 16px 18px; }
  .digitando span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: pulo 1.2s infinite ease-in-out; }
  .digitando span:nth-child(2) { animation-delay: .15s; }
  .digitando span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulo { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

  .entrada { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
  .entrada form {
    max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px;
    transition: border-color .15s;
  }
  .entrada form:focus-within { border-color: rgba(0,200,150,.6); }
  .entrada textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent; padding: 6px 0;
    max-height: 160px; line-height: 1.45;
  }
  .entrada textarea::placeholder { color: var(--muted); }
  .btn-enviar {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--green);
    color: #04261c; cursor: pointer; display: grid; place-items: center;
  }
  .btn-enviar:disabled { opacity: .45; cursor: default; }
  .dica { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 11.5px; text-align: center; }

  @media (max-width: 600px) {
    header { padding: 10px 14px; }
    header small { display: none; }
    #mensagens { padding: 16px 12px 8px; }
    .avatar { width: 30px; height: 30px; }
    .corpo { max-width: calc(100% - 42px); }
    .cards { grid-template-columns: 1fr; }
    .dica { display: none; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<main id="login">
  <form class="login-card" id="form-login" autocomplete="on">
    <div class="logo-mark" aria-hidden="true">EQI</div>
    <h1>Eventos Corporativos</h1>
    <p class="sub">Acesso exclusivo para assessores EQI</p>
    <div class="campo">
      <label for="nome">Seu nome</label>
      <input id="nome" name="nome" autocomplete="given-name" placeholder="Como devemos te chamar?" maxlength="40">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn-primario" id="btn-entrar" type="submit">Entrar</button>
    <div class="erro-login" id="erro-login" role="alert"></div>
  </form>
</main>

<!-- ============ CHAT ============ -->
<div id="chat" class="hidden">
  <header>
    <div class="titulo">
      <div class="logo-mark" aria-hidden="true">EQI</div>
      <div>
        <h1>Eventos Corporativos</h1>
        <small>Fatos relevantes de ações e FIIs</small>
      </div>
    </div>
    <button class="btn-sair" id="btn-sair" type="button">Sair</button>
  </header>

  <div id="mensagens" aria-live="polite">
    <div class="trilho" id="trilho"></div>
  </div>

  <div class="entrada">
    <form id="form-pergunta">
      <textarea id="pergunta" rows="1" maxlength="1000" placeholder="Pergunte sobre uma empresa ou evento…" aria-label="Sua pergunta"></textarea>
      <button class="btn-enviar" id="btn-enviar" type="submit" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="dica">Enter envia · Shift+Enter quebra linha · Fonte: fatos relevantes publicados na CVM</p>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — endereço do backend.
   Deixe "" quando o site é servido pelo próprio backend (mesmo endereço).
   Se publicar este arquivo na Vercel, coloque a URL HTTPS da API, ex.:
   const API_URL = "https://eqi-eventos.duckdns.org";
   ===================================================================== */
const API_URL = "";

const SUGESTOES = [
  "Teve OPA essa semana?",
  "O que aconteceu com a Petrobras?",
  "Quais FIIs fizeram emissão de cotas?",
  "Teve recuperação judicial recente?",
  "Quais empresas fizeram desdobramento esse ano?",
  "Novidades de hoje?",
];
const ROTULO_FII = "FII";

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} },
};

let sessao = store.get("eqi_sessao");     // { token, expira_em, nome }
let conversa = store.get("eqi_conversa") || []; // [{ role, content, eventos?, meta?, erro? }]
let enviando = false;

/* ---------------- utilidades ---------------- */
function escapar(t) {
  return String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function formatarTexto(t) {
  // Texto puro -> parágrafos, com **negrito** simples. Todo o conteúdo é escapado antes.
  return escapar(t).split(/\n{2,}/).map((p) =>
    "<p>" + p.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>") + "</p>"
  ).join("");
}
function linkSeguro(url) {
  try { const u = new URL(url); return (u.protocol === "https:" || u.protocol === "http:") ? u.href : null; }
  catch { return null; }
}
function inicial() {
  const n = (sessao?.nome || "").trim();
  return n ? n[0].toUpperCase() : "A";
}
function sessaoValida() {
  return sessao && sessao.token && sessao.expira_em * 1000 > Date.now();
}

/* ---------------- telas ---------------- */
function mostrarLogin(msg) {
  $("chat").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("erro-login").textContent = msg || "";
  $("nome").value = sessao?.nome || store.get("eqi_nome") || "";
  setTimeout(() => ($("nome").value ? $("senha") : $("nome")).focus(), 50);
}
function mostrarChat() {
  $("login").classList.add("hidden");
  $("chat").classList.remove("hidden");
  renderizarTudo();
  $("pergunta").focus();
}

/* ---------------- login ---------------- */
$("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btn-entrar");
  btn.disabled = true; $("erro-login").textContent = "";
  try {
    const r = await fetch(API_URL + "/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ senha: $("senha").value }),
    });
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dados.detail || "Não foi possível entrar.");
    const nome = $("nome").value.trim();
    store.set("eqi_nome", nome);
    sessao = { token: dados.token, expira_em: dados.expira_em, nome };
    store.set("eqi_sessao", sessao);
    $("senha").value = "";
    mostrarChat();
  } catch (err) {
    $("erro-login").textContent = err.message === "Failed to fetch" ? "Servidor indisponível. Tente novamente." : err.message;
  } finally {
    btn.disabled = false;
  }
});

$("btn-sair").addEventListener("click", () => {
  sessao = null; conversa = [];
  store.del("eqi_sessao"); store.del("eqi_conversa");
  $("trilho").innerHTML = "";
  mostrarLogin();
});

/* ---------------- renderização ---------------- */
function elMensagem(papel) {
  const msg = document.createElement("div");
  msg.className = "msg " + (papel === "user" ? "usuario" : "assistente");
  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = papel === "user" ? inicial() : "EQI";
  const corpo = document.createElement("div");
  corpo.className = "corpo";
  msg.append(av, corpo);
  return { msg, corpo };
}

function elCard(ev) {
  const card = document.createElement("article");
  card.className = "card";
  const badges = `<span class="badge" data-tipo="${escapar(ev.tipo_evento || "")}">${escapar(ev.tipo_evento_rotulo || "Evento")}</span>` +
    (ev.tipo_ativo === "FII" ? `<span class="badge" data-tipo="FII">${ROTULO_FII}</span>` : "");
  const link = linkSeguro(ev.link);
  card.innerHTML = `
    <div class="badges">${badges}</div>
    <div class="empresa">${escapar(ev.empresa)}</div>
    <div class="assunto">${escapar(ev.assunto)}</div>
    <div class="rodape">
      <span class="data">${escapar(ev.data)}</span>
      ${link ? `<a class="btn-pdf" href="${escapar(link)}" target="_blank" rel="noopener noreferrer">Ver PDF</a>` : ""}
    </div>`;
  return card;
}

function renderizarMensagem(m) {
  const { msg, corpo } = elMensagem(m.role);
  const bolha = document.createElement("div");
  bolha.className = "bolha" + (m.erro ? " erro" : "");
  if (m.role === "user") bolha.textContent = m.content;
  else bolha.innerHTML = formatarTexto(m.content);
  corpo.appendChild(bolha);

  if (m.eventos && m.eventos.length) {
    const cards = document.createElement("div");
    cards.className = "cards";
    m.eventos.forEach((ev) => cards.appendChild(elCard(ev)));
    corpo.appendChild(cards);
    const total = m.meta?.total || 0;
    if (total > m.eventos.length) {
      const mais = document.createElement("div");
      mais.className = "mais-eventos";
      mais.textContent = `Mostrando ${m.eventos.length} de ${total} eventos. Refine a pergunta para ver outros.`;
      corpo.appendChild(mais);
    }
  }
  $("trilho").appendChild(msg);
}

function renderizarBoasVindas() {
  const nome = (sessao?.nome || "").trim();
  const { msg, corpo } = elMensagem("assistant");
  const bolha = document.createElement("div");
  bolha.className = "bolha";
  bolha.innerHTML = formatarTexto(
    `Olá${nome ? ", " + nome : ""}! Sou o Assistente EQI de Eventos Corporativos.\n\n` +
    "Acompanho os fatos relevantes publicados na CVM — OPAs, fusões e aquisições, recuperações judiciais, " +
    "cancelamentos de registro, desdobramentos, emissões de cotas de FIIs e mais. Pergunte em linguagem natural:"
  );
  const sug = document.createElement("div");
  sug.className = "sugestoes";
  SUGESTOES.forEach((s) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sugestao"; b.textContent = s;
    b.addEventListener("click", () => enviar(s));
    sug.appendChild(b);
  });
  corpo.append(bolha, sug);
  $("trilho").appendChild(msg);
}

function renderizarTudo() {
  $("trilho").innerHTML = "";
  renderizarBoasVindas();
  conversa.forEach(renderizarMensagem);
  rolar();
}

function rolar() {
  const area = $("mensagens");
  requestAnimationFrame(() => (area.scrollTop = area.scrollHeight));
}

function mostrarDigitando() {
  const { msg, corpo } = elMensagem("assistant");
  msg.id = "digitando";
  corpo.innerHTML = '<div class="bolha digitando" aria-label="Digitando"><span></span><span></span><span></span></div>';
  $("trilho").appendChild(msg);
  rolar();
}

/* ---------------- envio ---------------- */
async function enviar(texto) {
  const pergunta = (texto ?? $("pergunta").value).trim();
  if (!pergunta || enviando) return;
  if (!sessaoValida()) return mostrarLogin("Sua sessão expirou. Entre novamente.");

  enviando = true;
  $("btn-enviar").disabled = true;
  $("pergunta").value = ""; ajustarAltura();

  const historico = conversa.filter((m) => !m.erro).map((m) => ({ role: m.role, content: m.content })).slice(-20);
  const msgUsuario = { role: "user", content: pergunta };
  conversa.push(msgUsuario);
  renderizarMensagem(msgUsuario);
  mostrarDigitando();

  try {
    const r = await fetch(API_URL + "/consultar", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessao.token },
      body: JSON.stringify({ pergunta, historico }),
    });
    const dados = await r.json().catch(() => ({}));
    if (r.status === 401) {
      conversa.pop(); store.set("eqi_conversa", conversa);
      sessao = null; store.del("eqi_sessao");
      return mostrarLogin("Sua sessão expirou. Entre novamente.");
    }
    if (!r.ok) throw new Error(dados.detail || "Não consegui consultar agora. Tente novamente em instantes.");
    const resposta = { role: "assistant", content: dados.resposta, eventos: dados.eventos || [], meta: dados.meta || {} };
    conversa.push(resposta);
    $("digitando")?.remove();
    renderizarMensagem(resposta);
  } catch (err) {
    $("digitando")?.remove();
    const msg = err.message === "Failed to fetch" ? "Sem conexão com o servidor. Verifique sua internet e tente de novo." : err.message;
    const erro = { role: "assistant", content: msg, erro: true };
    conversa.push(erro);
    renderizarMensagem(erro);
  } finally {
    store.set("eqi_conversa", conversa.slice(-60));
    enviando = false;
    $("btn-enviar").disabled = false;
    rolar();
    $("pergunta").focus();
  }
}

function ajustarAltura() {
  const t = $("pergunta");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 160) + "px";
}

$("form-pergunta").addEventListener("submit", (e) => { e.preventDefault(); enviar(); });
$("pergunta").addEventListener("input", ajustarAltura);
$("pergunta").addEventListener("keydown", (e) => {
